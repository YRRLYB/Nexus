name: Build Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:ui
      - run: npm run package
      - run: npm run test:package
      - shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
          $artifact = Get-Item "release/Nexus-$version-Windows-x64.exe"
          $hash = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLower()
          "$hash  $($artifact.Name)" | Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-Windows
          path: |
            release/Nexus-*-Windows-x64.exe
            release/SHA256SUMS.txt
  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nexus-Windows
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "Nexus $GITHUB_REF_NAME" --generate-notes --verify-tag
