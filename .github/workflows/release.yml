name: Build Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:ui
      - run: npm run package
      - run: npm run test:package
      - shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
          $artifact = Get-Item "release/Nexus-$version-Windows-x64.exe"
          $hash = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLower()
          "$hash  $($artifact.Name)" | Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-Windows
          path: |
            release/Nexus-*-Windows-x64.exe
            release/SHA256SUMS.txt
  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: Nexus-Windows
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const section = readFileSync('CHANGELOG.md', 'utf8').split(`## ${version} `)[1];
          if (!section) throw new Error('Missing changelog entry');
          const notes = section.split('\n## ')[0].split('\n').slice(1).join('\n').trim();
          writeFileSync('release-notes.md', notes + '\n\nWindows x64 便携版，未签名。升级前退出旧版，运行前核对 SHA256SUMS.txt。\n');
          NODE
          gh release create "$GITHUB_REF_NAME" release/*.exe release/SHA256SUMS.txt --title "Nexus ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag
